title: 大模型与 Agent 工程笔记
description: 面向有 Python 基础的开发者：大模型、RAG 与 Agent 的设计、评估和失败排查；含机器学习与深度学习基础笔记。
lang: zh-CN
repository: loveunk/deep-learning-llm-agent-notes
repository_branch: master

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-titles-from-headings

include:
  - CONTRIBUTING.md

optional_front_matter:
  remove_originals: true

readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: false

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      render_with_liquid: false
      maintenance_status: 学习笔记；请结合原始资料核对结论
  - scope:
      path: "llm"
    values:
      maintenance_status: 工程笔记；示例尚未统一运行验收
  - scope:
      path: "reading"
    values:
      maintenance_status: 人工精选归档；以各期原始日期为准
  - scope:
      path: "math"
    values:
      maintenance_status: 历史基础笔记；持续接受纠错
      math: true
  - scope:
      path: "machine-learning"
    values:
      math: true
  - scope:
      path: "tensorflow"
    values:
      maintenance_status: 历史学习材料；接口与依赖需按当前环境复核
  - scope:
      path: "pytorch"
    values:
      maintenance_status: 历史学习材料；接口与依赖需按当前环境复核

exclude:
  - Gemfile
  - Gemfile.lock
  - tools
  - tests
  - vendor
  - node_modules
  - .github
  - .gitignore
  - .DS_Store
